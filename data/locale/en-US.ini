Tooltip.Status="Connection state of this output."
Tooltip.Duration="Time since this output connected."
Tooltip.DurationDetected="Measured from when this dock detected the output, within 0.25 s of it starting."
Tooltip.Bitrate="Current bitrate, measured from the bytes this output sent over the last 2 seconds (same formula as the OBS Stats dock). The average covers the whole session."
Tooltip.Dropped="Frames this output dropped because the connection could not keep up (network or bandwidth). Not related to rendering or encoding lag."
Tooltip.RecentDrops="Last 10 seconds: %1 dropped."
Tooltip.SinceReset="Counted since statistics were reset."
Tooltip.LagSinceLoaded="Counted since OBS finished loading, the same period as the OBS Stats dock."
Tooltip.LagSinceVideoReset="Counted since the video settings were last applied, the same period as the OBS Stats dock."
Tooltip.LagSinceUserReset="Counted since this dock's statistics were reset. The OBS Stats dock keeps its own count."
Tooltip.Congestion="How full the output's send buffer is (0% = no congestion). Averaged like the OBS status bar indicator."
Tooltip.Video="Resolution and frame rate this output's encoder produces."
Tooltip.Encoders="Configured video and audio encoders. The target is the configured bitrate, not a measurement."
Tooltip.PipelineDedicated="This encoder has its own video pipeline; its encoding lag is shown separately."
Tooltip.PipelineShared="This encoder uses the main video pipeline; see Skipped frames due to encoding lag under OBS Performance."
Tooltip.EncodingLag="Frames skipped because this output's dedicated encoder pipeline could not keep up. Shared by every output that uses the same pipeline."
Tooltip.DataSent="Total data sent by this output during the session."
Tooltip.Connection="Server handshake time and reconnect attempts during this session."
Tooltip.Server="Ingest server host and protocol. The stream key is never read or shown."
Tooltip.Delay="Stream delay configured for this output."
Tooltip.LastError="Error message reported by the output when it stopped."

